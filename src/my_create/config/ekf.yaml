ekf_filter_node:
  ros__parameters:
    use_sim_time: false

    # [座標系設定]
    frequency: 30.0             # 濾波器的運行頻率
    odom_frame: odom            # [輸出] 融合後的 odom 座標系
    base_link_frame: base_link  # 機器人的基準座標系
    world_frame: odom           # 我們只做 odom，不做 map

    # publish_tf: true
    two_d_mode: true

    # [輸入設定]
    # 我們將輪式里程計的 X, Y, Yaw 速度輸入進來
    odom0: /wheel/odom
    odom0_config: [false, false, false,  # Position: 不使用
                   false, false, false,  # Orientation: 不使用
                   true,  true,  false,  # Linear Velocity: [只信任] Vx, Vy
                   false, false, true,  # Angular Velocity: [完全不信任] 輪式里程計的旋轉
                   false, false, false]
    odom0_differential: false

    # 我們將 IMU 的 Roll, Pitch, Yaw 和角速度輸入進來
    # imu0: /camera/camera/imu # /imu/data
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,  # Orientation: [不信任] IMU 的絕對姿態
                  false, false, false,
                  true,  true,  true,   # Angular Velocity: [信任 R, P, Y 角速度]
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true