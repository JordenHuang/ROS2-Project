# Model of the Intel Realsense D455 RGBD camera.
# keywords: sensor/range-finder, sensor/camera
# template language: javascript

PROTO RealsenseD455 [
  field SFVec3f translation 0 0 0
  field SFRotation rotation 0 0 1 0
  field SFString name "RealsenseD455"
  field SFBool locked FALSE
  field SFString controller "<generic>"
  field MFString controllerArgs [ ]
  field SFBool supervisor FALSE
#   field SFString{"HD", "VGA", "FULL"} resolution "VGA"
  field SFInt32 width         640          # Defines the `width` field of the `RangeFinder` and `Camera` nodes.
  field SFInt32 height        480          # Defines the `height` field of the `RangeFinder` and `Camera` nodes.
  field SFFloat fieldOfView 1.4746  # Diagonal ~84.43° from inr parametrs
  field SFFloat minRange 0.01
  field SFFloat maxRange 6.0
  field SFNode focus NULL
  field SFNode recognition Recognition{}
  field SFNode physics Physics {
    density -1
    mass 0.35
    centerOfMass [0 0 0]
  }
]
{
  %<
    const width = fields.width.value;
    const height = fields.height.value;
    const cameraName = fields.name.value;
  >%

  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    locked IS locked

    children [
      RangeFinder {
        translation 0.005 0 0
        name %<='"' + cameraName + '_depth"'>%
        locked TRUE
        radarCrossSection 0.01
        fieldOfView IS fieldOfView
        width %<= width >%
        height %<= height >%
        near IS minRange
        minRange IS minRange
        maxRange IS maxRange
        noise 0.01
        resolution 0.001
      }

      Camera {
        translation 0.005 0 0
        name %<='"' + cameraName + '_rgb"'>%
        locked TRUE
        fieldOfView IS fieldOfView
        width %<= width >%
        height %<= height >%
        near IS minRange
        far 10
        exposure 0.5
        antiAliasing TRUE
        noise 0.01
        focus IS focus
        recognition IS recognition
      }

      Emitter {
        name %<='"' + cameraName + '_emitter"'>%
        channel 1
        range -1
        bufferSize 5000000
      }

      Receiver {
        name %<='"' + cameraName + '_receiver"'>%
        channel 2
        bufferSize 5000000
      }

      Display {
        name %<='"' + cameraName + '_display"'>%
        width %<= width >%
        height %<= height >%
      }

      Solid {
        translation 0.013 0 0
        rotation 0.5773489358556708 0.5773509358554485 0.5773509358554485 2.0944
        children [
          CadShape {
            url [
              "./Realsense_meshes/IntelRealsenseD455.dae"
            ]
          }
        ]
        locked TRUE
      }
    ]

    boundingObject Pose {
      children [
        Box {
          size 0.027 0.123 0.025
        }
      ]
    }
    physics IS physics
  }
}